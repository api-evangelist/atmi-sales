aid: atmi-sales
name: ATMI Sales
description: 'ATMI Sales (Advanced Technical Marketing Inc.) is a manufacturers'' representative
  and technical sales firm serving the electronics and semiconductor industry across
  the Pacific Northwest and Western Canada. The company connects customers with component
  suppliers through a research, development, and build model — identifying suitable
  technology solutions, building supplier relationships, and ensuring component availability
  and supply-chain sourcing in the regions where products are manufactured. ATMI maintains
  a line card of partner technologies and works with distributors to fulfill orders.
  This is a non-developer B2B sales and distribution company; it publishes no public
  API, SDK, or developer program. Surfaced as a portfolio company of sierra-ventures
  and profiled in the API Evangelist network.'
